<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宅建模試 ランキング [先生用]</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh; color: white;
    }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: block; }

    /* ===== 接続中 ===== */
    #s-connecting.active {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh; gap: 14px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .connecting-msg { color: #aaa; font-size: 15px; }
    .retry-btn {
      display: none; margin-top: 8px; padding: 10px 24px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: white; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-family: inherit;
    }

    /* ===== 模試選択 ===== */
    #s-select { padding: 32px 20px; }
    .page-header { text-align: center; margin-bottom: 28px; }
    .page-header h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .page-header p { color: #aaa; font-size: 14px; }
    .exam-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px; max-width: 700px; margin: 0 auto 24px;
    }
    .exam-card {
      position: relative;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 16px 12px;
      text-align: center; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit; color: white; border: 2px solid transparent;
    }
    .exam-card:hover { background: rgba(255,255,255,0.13); transform: scale(1.02); }
    .exam-card.has-data { border-color: rgba(86,211,100,0.4); }
    .exam-num  { font-size: 17px; font-weight: 800; margin-bottom: 3px; }
    .exam-meta { font-size: 11px; color: #888; }
    .exam-card.has-data .exam-meta { color: #56d364; }
    .exam-badge {
      position: absolute; top: 6px; right: 6px;
      background: #56d364; color: #000;
      font-size: 10px; font-weight: 700;
      padding: 2px 5px; border-radius: 8px;
    }
    .footer-btn { text-align: center; }
    .outline-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #ccc; padding: 10px 22px;
      border-radius: 8px; cursor: pointer;
      font-size: 13px; font-family: inherit;
    }
    .outline-btn:hover { background: rgba(255,255,255,0.14); }

    /* ===== メイン ===== */
    #s-main { padding: 18px; }
    .top-bar {
      display: flex; align-items: center;
      gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .back-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white; padding: 7px 13px;
      border-radius: 8px; cursor: pointer;
      font-size: 13px; font-family: inherit;
    }
    .back-btn:hover { background: rgba(255,255,255,0.18); }
    .exam-title { font-size: 20px; font-weight: 800; }
    .live-badge {
      background: #e74c3c; font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 20px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .dot { width:7px;height:7px;background:white;border-radius:50%;animation:blink 1.5s infinite; }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

    .layout {
      display: grid; grid-template-columns: 256px 1fr;
      gap: 18px; max-width: 1080px; align-items: start;
    }
    @media(max-width:680px){ .layout{ grid-template-columns:1fr; } }

    .qr-panel {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 20px 16px; text-align: center;
    }
    .qr-panel h3 { font-size: 13px; color: #aaa; margin-bottom: 12px; }
    #qrcode { background:white; border-radius:10px; padding:10px; display:inline-block; margin-bottom:12px; }
    .room-label { font-size: 11px; color: #888; }
    .room-code  { font-size: 18px; font-weight: 800; letter-spacing: 3px; font-family: monospace; margin-bottom: 8px; }
    .status-online { font-size: 12px; color: #56d364; margin: 6px 0; }
    .counter { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 5px 12px; font-size: 13px; display: inline-block; }

    .share-area {
      margin: 12px 0 4px; background: rgba(0,0,0,0.25);
      border-radius: 10px; padding: 10px 12px; text-align: left;
    }
    .share-label-sm { font-size: 11px; color: #888; margin-bottom: 5px; }
    .share-url { font-size: 10px; color: #aaa; word-break: break-all; line-height: 1.4; margin-bottom: 8px; }

    .panel-btn {
      width: 100%; padding: 9px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 13px; font-weight: 600;
      margin-bottom: 7px; font-family: inherit;
    }
    .btn-copy  { background: rgba(86,211,100,0.15);  border: 1px solid rgba(86,211,100,0.4);  color: #56d364; }
    .btn-line  { background: #06C755; color: white; }
    .btn-reset { background: rgba(231,76,60,0.15);   border: 1px solid rgba(231,76,60,0.4);   color: #e74c3c; }
    .btn-back  { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); color: #ccc; }
    .btn-copy:hover  { background: rgba(86,211,100,0.3); }
    .btn-line:hover  { background: #05a848; }
    .btn-reset:hover { background: rgba(231,76,60,0.3); }
    .btn-back:hover  { background: rgba(255,255,255,0.14); }

    /* ランキング */
    .rank-item {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px; padding: 12px 15px; margin-bottom: 8px;
      animation: fi 0.3s ease;
    }
    @keyframes fi { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    .rank-item.gold   { background:rgba(255,215,0,0.1);   border-color:rgba(255,215,0,0.3); }
    .rank-item.silver { background:rgba(192,192,192,0.1); border-color:rgba(192,192,192,0.25); }
    .rank-item.bronze { background:rgba(205,127,50,0.1);  border-color:rgba(205,127,50,0.3); }
    .medal    { font-size:22px; width:32px; text-align:center; flex-shrink:0; }
    .rank-num { font-size:16px; font-weight:800; width:32px; text-align:center; color:#777; flex-shrink:0; }
    .rank-name{ flex:1; font-size:clamp(14px,2vw,16px); font-weight:600; padding:0 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank-score{ font-size:clamp(18px,3vw,22px); font-weight:800; color:#56d364; flex-shrink:0; }
    .rank-score .u { font-size:11px; color:#888; font-weight:400; }
    .empty { text-align:center; color:#555; padding:50px 20px; }
    .empty .icon { font-size:40px; margin-bottom:10px; }

    /* ===== 過去結果 ===== */
    #s-history { padding: 28px 20px; }
    .history-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px; max-width: 880px; margin: 20px auto 0;
    }
    .history-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 16px 18px;
    }
    .history-card h3 { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
    .history-meta { font-size: 11px; color: #666; margin-bottom: 8px; }
    .history-row {
      display: flex; justify-content: space-between;
      font-size: 12px; padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .history-row:last-child { border-bottom: none; }
    .h-name  { color: #ccc; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
    .h-score { color: #56d364; font-weight: 700; flex-shrink:0; }
    .view-btn {
      margin-top: 10px; width: 100%; padding: 7px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      color: #ccc; border-radius: 7px; cursor: pointer;
      font-size: 12px; font-family: inherit;
    }
    .view-btn:hover { background: rgba(255,255,255,0.14); }
  </style>
</head>
<body>

<!-- 接続中 -->
<div id="s-connecting" class="screen active">
  <div class="spinner"></div>
  <div class="connecting-msg" id="conn-msg">サーバーに接続中...</div>
  <button class="retry-btn" id="retry-btn" onclick="location.reload()">再読み込み</button>
</div>

<!-- 模試選択 -->
<div id="s-select" class="screen">
  <div class="page-header">
    <h1>🏠 宅建模試ランキング</h1>
    <p>今日の模試を選んでください</p>
  </div>
  <div class="exam-grid" id="exam-grid"></div>
  <div class="footer-btn">
    <button class="outline-btn" onclick="showHistory()">📊 過去の結果を見る</button>
  </div>
</div>

<!-- ランキング中 -->
<div id="s-main" class="screen">
  <div class="top-bar">
    <button class="back-btn" onclick="goSelect()">← 模試選択</button>
    <span class="exam-title" id="current-title">模擬試験1</span>
    <span class="live-badge"><span class="dot"></span>LIVE</span>
  </div>
  <div class="layout">
    <div class="qr-panel">
      <h3>生徒用QRコード</h3>
      <div id="qrcode"></div>
      <div class="room-label">ルームコード</div>
      <div class="room-code" id="room-display">------</div>
      <div class="status-online">● 受付中</div>
      <div class="counter">参加者: <span id="count">0</span>人</div>

      <div class="share-area">
        <div class="share-label-sm">生徒に送るURL（点数入力）</div>
        <div class="share-url" id="join-url-text">—</div>
        <button class="panel-btn btn-copy" onclick="copyJoinUrl()">📋 URLをコピー</button>
        <button class="panel-btn btn-line" onclick="shareToLine()">💬 LINEで送る</button>
      </div>

      <div class="share-area" style="margin-top:10px;">
        <div class="share-label-sm" style="color:#f0c040;">📊 成績閲覧QR（生徒・保護者用）</div>
        <div id="results-qrcode" style="background:white;border-radius:8px;padding:8px;display:inline-block;margin:8px 0;"></div>
        <div class="share-url" id="results-url-text">—</div>
        <button class="panel-btn btn-copy" onclick="copyResultsUrl()">📋 成績URLをコピー</button>
        <button class="panel-btn btn-line" onclick="shareResultsToLine()">💬 LINEで成績URLを送る</button>
      </div>

      <button class="panel-btn btn-reset" onclick="resetCurrent()">🗑 スコアリセット</button>
      <button class="panel-btn btn-back"  onclick="goSelect()">← 模試を変える</button>
    </div>

    <div>
      <div id="ranking-list">
        <div class="empty"><div class="icon">⏳</div>生徒の送信を待っています...</div>
      </div>
    </div>
  </div>
</div>

<!-- 過去結果 -->
<div id="s-history" class="screen">
  <div class="top-bar">
    <button class="back-btn" onclick="goSelect()">← 模試選択</button>
    <span class="exam-title">過去の結果</span>
  </div>
  <div class="history-grid" id="history-grid"></div>
</div>

<script>
  // ============================================================
  // ローカルストレージ（永久保存）
  // ============================================================
  const STORAGE_KEY = 'takken_exam_scores';
  const ROOM_KEY    = 'takken_room_code';
  function localAll()    { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); } catch { return {}; } }
  function saveLocal(n, name, score) {
    const all = localAll(), key = `exam${n}`;
    if (!all[key]) all[key] = { scores: [], date: null };
    const idx = all[key].scores.findIndex(s => s.name === name);
    if (idx >= 0) all[key].scores[idx].score = score;
    else all[key].scores.push({ name, score });
    if (!all[key].date) all[key].date = new Date().toLocaleDateString('ja-JP');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    publishScores(n, all[key]);
  }
  function resetLocal(n) {
    const all = localAll(); delete all[`exam${n}`];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    if (mqttClient && mqttClient.connected) {
      mqttClient.publish(`takken/data/${roomCode}/exam${n}`, '', { qos: 1, retain: true });
    }
  }
  function publishScores(n, examData) {
    if (!mqttClient || !mqttClient.connected) return;
    mqttClient.publish(`takken/data/${roomCode}/exam${n}`, JSON.stringify(examData), { qos: 1, retain: true });
  }

  // ============================================================
  // 状態
  // ============================================================
  const MEDALS  = ['🥇','🥈','🥉'];
  const CLASSES = ['gold','silver','bronze'];
  const BROKER  = 'wss://broker.hivemq.com:8884/mqtt';

  const roomCode = (() => {
    let code = localStorage.getItem(ROOM_KEY);
    if (!code) { code = Math.random().toString(36).substr(2,8).toUpperCase(); localStorage.setItem(ROOM_KEY, code); }
    return code;
  })();
  let mqttClient  = null;
  let currentExam = null;
  let joinUrl     = '';

  // ============================================================
  // MQTT 接続
  // ============================================================
  const connTimeout = setTimeout(() => {
    document.getElementById('conn-msg').textContent = '接続に失敗しました。再読み込みしてください。';
    document.getElementById('retry-btn').style.display = 'inline-block';
  }, 15000);

  mqttClient = mqtt.connect(BROKER, {
    clientId: 'host_' + roomCode,
    clean: true,
    connectTimeout: 12000,
    reconnectPeriod: 5000,
  });

  mqttClient.on('connect', () => {
    clearTimeout(connTimeout);
    mqttClient.subscribe(`takken/${roomCode}`, { qos: 1 });

    // join URL 確定
    const base = window.location.href.replace(/host\.html.*$/, '');
    joinUrl = `${base}join.html?room=${roomCode}`;

    show('s-select');
    buildExamGrid();
  });

  mqttClient.on('message', (_topic, payload) => {
    try {
      const data = JSON.parse(payload.toString());
      if (!data.name || typeof data.score !== 'number') return;
      if (currentExam === null) return;
      saveLocal(currentExam, data.name, data.score);
      renderRanking();
    } catch {}
  });

  mqttClient.on('error', () => {});

  // ============================================================
  // 画面切替
  // ============================================================
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ============================================================
  // 模試グリッド
  // ============================================================
  function buildExamGrid() {
    const all  = localAll();
    const grid = document.getElementById('exam-grid');
    grid.innerHTML = Array.from({length:15}, (_,i) => {
      const n = i+1, d = all[`exam${n}`], cnt = d ? d.scores.length : 0;
      return `
        <button class="exam-card ${cnt>0?'has-data':''}" onclick="startExam(${n})">
          ${cnt>0 ? `<div class="exam-badge">${cnt}人</div>` : ''}
          <div class="exam-num">模試 ${n}</div>
          <div class="exam-meta">${cnt>0 ? (d.date||'実施済み') : '未実施'}</div>
        </button>`;
    }).join('');
  }

  function goSelect() {
    currentExam = null;
    buildExamGrid();
    show('s-select');
  }

  // ============================================================
  // 模試開始
  // ============================================================
  function startExam(n) {
    currentExam = n;
    document.getElementById('current-title').textContent = `模擬試験 ${n}`;

    const examJoinUrl = `${joinUrl}&exam=${n}`;
    document.getElementById('join-url-text').textContent = examJoinUrl;
    document.getElementById('room-display').textContent  = roomCode;
    window._examJoinUrl = examJoinUrl;

    // 生徒用QR（点数入力）
    const qrEl = document.getElementById('qrcode');
    qrEl.innerHTML = '';
    new QRCode(qrEl, { text: examJoinUrl, width: 180, height: 180, colorDark:'#000', colorLight:'#fff' });

    // 成績閲覧QR
    const base2 = window.location.href.replace(/host\.html.*$/, '');
    const resultsUrl = `${base2}results.html?room=${roomCode}`;
    document.getElementById('results-url-text').textContent = resultsUrl;
    window._resultsUrl = resultsUrl;
    const rqEl = document.getElementById('results-qrcode');
    rqEl.innerHTML = '';
    new QRCode(rqEl, { text: resultsUrl, width: 140, height: 140, colorDark:'#000', colorLight:'#fff' });

    renderRanking();
    show('s-main');
  }

  function resetCurrent() {
    if (!confirm(`模擬試験 ${currentExam} のスコアをリセットしますか？`)) return;
    resetLocal(currentExam);
    renderRanking();
  }

  // ============================================================
  // ランキング描画
  // ============================================================
  function renderRanking() {
    if (currentExam === null) return;
    const exam   = localAll()[`exam${currentExam}`] || { scores: [] };
    const scores = [...exam.scores].sort((a,b) => b.score - a.score);
    document.getElementById('count').textContent = scores.length;
    const list = document.getElementById('ranking-list');
    if (!scores.length) {
      list.innerHTML = `<div class="empty"><div class="icon">⏳</div>生徒の送信を待っています...</div>`;
      return;
    }
    list.innerHTML = scores.map((s,i) => {
      const cls = CLASSES[i]??'', med = MEDALS[i]??'';
      return `
        <div class="rank-item ${cls}">
          ${med ? '' : `<div class="rank-num">${i+1}</div>`}
          <div class="medal">${med}</div>
          <div class="rank-name">${esc(s.name)}</div>
          <div class="rank-score">${s.score}<span class="u">点</span></div>
        </div>`;
    }).join('');
  }

  // ============================================================
  // 過去結果
  // ============================================================
  function showHistory() {
    const all  = localAll();
    const keys = Object.keys(all).sort((a,b) => +a.replace('exam','') - +b.replace('exam',''));
    const grid = document.getElementById('history-grid');
    if (!keys.length) {
      grid.innerHTML = `<p style="color:#666;grid-column:1/-1;text-align:center;padding:60px 0">まだ結果がありません</p>`;
    } else {
      grid.innerHTML = keys.map(key => {
        const n = key.replace('exam',''), d = all[key];
        const top = [...d.scores].sort((a,b)=>b.score-a.score).slice(0,5);
        return `<div class="history-card">
          <h3>模擬試験 ${n}</h3>
          <div class="history-meta">${d.date||''} ／ ${d.scores.length}人参加</div>
          ${top.map(s=>`<div class="history-row"><span class="h-name">${esc(s.name)}</span><span class="h-score">${s.score}点</span></div>`).join('')}
          <button class="view-btn" onclick="startExam(${n})">このランキングを表示</button>
        </div>`;
      }).join('');
    }
    show('s-history');
  }

  // ============================================================
  // URL 共有
  // ============================================================
  async function copyJoinUrl() {
    const url = window._examJoinUrl; if (!url) return;
    try {
      await navigator.clipboard.writeText(url);
      const btn = document.querySelector('.btn-copy');
      btn.textContent = '✅ コピーしました！';
      setTimeout(() => btn.textContent = '📋 URLをコピー', 2000);
    } catch { prompt('このURLをコピーしてください:', url); }
  }

  async function copyResultsUrl() {
    const url = window._resultsUrl; if (!url) return;
    try {
      await navigator.clipboard.writeText(url);
      const btns = document.querySelectorAll('.btn-copy');
      const btn = btns[1];
      btn.textContent = '✅ コピーしました！';
      setTimeout(() => btn.textContent = '📋 成績URLをコピー', 2000);
    } catch { prompt('このURLをコピーしてください:', url); }
  }

  function shareToLine() {
    const url  = window._examJoinUrl; if (!url) return;
    const text = encodeURIComponent(`【宅建模試】点数を入力してください👇\n${url}`);
    window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}&text=${text}`, '_blank');
  }

  function shareResultsToLine() {
    const url  = window._resultsUrl; if (!url) return;
    const text = encodeURIComponent(`【宅建模試】成績ランキングはこちら👇\n${url}`);
    window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}&text=${text}`, '_blank');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
