<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シーラ様専用 宅建模試成績ランキング スマホ版</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* ===================== リセット & 基本 ===================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:      #f7f7f2;
      --sub:      #c5c0b8;
      --faint:    #8e8880;
      --line:     rgba(255,255,255,0.12);
      --paper:    #fffdf5;
      --surface:  #15110f;
      --accent:   #e1091a;
      --accent-2: #8f1018;
      --gold:     #f4c451;
      --gold-deep:#9d6710;
      --red:      #e1091a;
      --red-dark: #3b090b;
      --shadow:   0 24px 58px rgba(0,0,0,0.46);
    }
    html { background: #080808; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      background:
        radial-gradient(circle at 50% -8rem, rgba(225,9,26,0.32), transparent 28rem),
        radial-gradient(circle at 0 24rem, rgba(244,196,81,0.10), transparent 20rem),
        linear-gradient(180deg, #101010 0%, #070707 48%, #111 100%);
      color: var(--ink);
      min-height: 100vh;
      letter-spacing: 0;
    }

    /* ===================== アプリヘッダー ===================== */
    .hero {
      max-width: 920px;
      margin: 0 auto;
      padding: 18px 16px 10px;
    }
    .hero-badge {
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hero h1 {
      font-size: clamp(25px, 5vw, 36px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .hero h1 span { display: block; color: var(--gold); text-shadow: 0 0 24px rgba(244,196,81,0.24); }
    .hero p {
      color: var(--sub);
      font-size: 13px;
      line-height: 1.7;
      margin-top: 8px;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }
    .stat {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.035));
      border: 1px solid rgba(225,9,26,0.42);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.24);
      padding: 14px 12px;
      min-width: 0;
    }
    .stat-num {
      font-size: clamp(19px, 4vw, 26px);
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
    }
    .stat-label {
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
    }

    /* ===================== メインコンテンツ ===================== */
    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 16px 44px;
    }

    /* ===================== 模試選択 ===================== */
    .section-title {
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      margin: 18px 0 10px;
    }
    .exam-buttons {
      display: flex;
      gap: 8px;
      margin: 0 -16px 18px;
      overflow-x: auto;
      padding: 0 16px 8px;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
    }
    .exam-buttons::-webkit-scrollbar { display: none; }
    .exam-btn {
      appearance: none;
      position: relative;
      flex: 0 0 96px;
      min-height: 62px;
      padding: 11px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: background 0.16s, border-color 0.16s, color 0.16s, transform 0.1s, box-shadow 0.16s;
      scroll-snap-align: start;
    }
    .exam-btn:hover {
      border-color: rgba(225,9,26,0.78);
      box-shadow: 0 12px 24px rgba(225,9,26,0.18);
    }
    .exam-btn:active { transform: scale(0.97); }
    .exam-btn.active {
      background: linear-gradient(180deg, var(--red), #8e0710);
      border-color: #ff2837;
      color: white;
      box-shadow: 0 14px 32px rgba(225,9,26,0.32);
    }
    .exam-btn.has-data:not(.active) {
      border-color: rgba(244,196,81,0.38);
      background: rgba(244,196,81,0.12);
    }
    .btn-num {
      display: block;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 5px;
    }
    .btn-sub {
      color: var(--sub);
      display: block;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }
    .exam-btn.active .btn-sub { color: rgba(255,255,255,0.66); }
    .btn-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 7px;
      height: 7px;
      background: var(--gold);
      border-radius: 999px;
    }
    .exam-btn.active .btn-dot { background: white; }

    /* ===================== ランキングカード ===================== */
    .ranking-card {
      background: linear-gradient(180deg, #4b0b0f 0%, #240607 100%);
      border: 5px solid var(--red);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: fadeUp 0.35s ease;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-header {
      background: linear-gradient(180deg, #17120f, #0d0b0a);
      border-bottom: 3px solid var(--red-dark);
      color: var(--ink);
      padding: 18px 16px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-header-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--gold), var(--gold-deep));
      color: #211305;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    .card-header-text h2 { font-size: 18px; font-weight: 800; letter-spacing: 0; }
    .card-header-text p  { font-size: 12px; color: var(--sub); margin-top: 3px; }
    .card-header-count {
      margin-left: auto;
      text-align: right;
    }
    .count-num   { font-size: 26px; font-weight: 800; color: var(--gold); }
    .count-label { font-size: 11px; color: var(--sub); font-weight: 700; }

    /* 表彰台 */
    .podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      padding: 24px 14px 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
    }
    .podium-item {
      flex: 1;
      max-width: 180px;
      text-align: center;
    }
    .podium-item.second { order: 1; }
    .podium-item.first  { order: 2; }
    .podium-item.third  { order: 3; }
    .podium-medal  {
      width: 42px;
      height: 42px;
      margin: 0 auto 8px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #241304;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(244,196,81,0.28);
    }
    .podium-name   { color: var(--paper); font-size: 13px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
    .podium-score  { font-size: 24px; font-weight: 800; }
    .podium-score .u { font-size: 12px; color: var(--sub); font-weight: 500; }
    .podium-block  {
      margin-top: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px 10px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: white;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .podium-item.first  .podium-medal,
    .podium-item.first  .podium-block,
    .podium-item.second .podium-medal,
    .podium-item.second .podium-block,
    .podium-item.third  .podium-medal,
    .podium-item.third  .podium-block {
      background: linear-gradient(180deg, #fff0a8 0%, var(--gold) 44%, var(--gold-deep) 100%);
      color: #251404;
    }
    .podium-item.first  .podium-block { height: 94px; }
    .podium-item.second .podium-block { height: 74px; }
    .podium-item.third  .podium-block { height: 60px; }
    .podium-item.first  .podium-score { color: var(--gold); }
    .podium-item.second .podium-score { color: var(--gold); }
    .podium-item.third  .podium-score { color: var(--gold); }

    /* 全体リスト */
    .rank-table {
      padding: 14px 12px 18px;
    }
    .rank-row {
      display: flex;
      align-items: center;
      background: var(--paper);
      border: 2px solid #6d1519;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.76);
      color: #111;
      min-height: 50px;
      padding: 9px 12px;
      margin-bottom: 8px;
      transition: background 0.1s;
    }
    .rank-row:hover { background: #ffffff; }
    .rank-row.rank1,
    .rank-row.rank2,
    .rank-row.rank3 {
      background: linear-gradient(90deg, #fff4bb 0%, #f6d770 46%, #fff5c9 100%);
      border-color: #6d1519;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.82),
        0 8px 22px rgba(244,196,81,0.18);
      min-height: 60px;
    }
    .rank-row.rank1 { min-height: 70px; }
    .r-rank  {
      width: 38px;
      height: 34px;
      border-radius: 8px;
      background: #2d8aa0;
      color: white;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 800;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18);
    }
    .rank1 .r-rank,
    .rank2 .r-rank,
    .rank3 .r-rank {
      width: 46px;
      height: 40px;
      background: linear-gradient(180deg, #fff0a8 0%, var(--gold) 45%, var(--gold-deep) 100%);
      color: #251404;
      font-size: 20px;
      box-shadow: 0 6px 16px rgba(157,103,16,0.28), inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .r-name  { flex: 1; font-size: 15px; font-weight: 800; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank1 .r-name,
    .rank2 .r-name,
    .rank3 .r-name { font-size: 17px; }
    .r-bar-wrap { flex: 1; height: 6px; background: rgba(0,0,0,0.12); border-radius: 999px; margin: 0 12px; max-width: 190px; overflow: hidden; }
    .r-bar  { height: 100%; background: linear-gradient(90deg, var(--red), var(--red-dark)); border-radius: 999px; transition: width 0.6s ease; }
    .rank1 .r-bar,
    .rank2 .r-bar,
    .rank3 .r-bar { background: linear-gradient(90deg, #7b1116, #df111f); }
    .r-score { font-size: 18px; font-weight: 800; color: #111; flex-shrink: 0; min-width: 54px; text-align: right; }
    .rank1 .r-score,
    .rank2 .r-score,
    .rank3 .r-score { color: #5b1606; font-size: 22px; }
    .r-score .u { font-size: 12px; color: #5f5750; font-weight: 600; }

    /* 統計サマリー */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 18px 12px 6px;
    }
    .stat-box {
      background: #160f0e;
      border: 1px solid rgba(225,9,26,0.42);
      border-radius: 8px;
      padding: 14px 10px;
      text-align: center;
    }
    .stat-box .val { font-size: 20px; font-weight: 800; color: var(--gold); }
    .stat-box .lbl { font-size: 11px; color: var(--sub); margin-top: 3px; font-weight: 700; }

    /* 空状態 */
    .empty-state {
      text-align: center;
      padding: 54px 22px;
      color: var(--sub);
    }
    .empty-state .icon {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--red), var(--accent-2));
      color: white;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      margin: 0 auto 14px;
    }
    .empty-state h3 { font-size: 17px; color: var(--ink); margin-bottom: 6px; }
    .empty-state p  { font-size: 14px; }

    /* ===================== アクションボタン ===================== */
    .action-bar {
      padding: 16px 12px 18px;
      border-top: 2px solid var(--red-dark);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .action-btn {
      flex: 1;
      min-width: 140px;
      padding: 14px 20px;
      border-radius: 16px;
      border: 1px solid transparent;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      font-family: inherit;
    }
    .action-btn:hover { opacity: 0.90; box-shadow: 0 10px 20px rgba(0,0,0,0.10); }
    .action-btn:active { transform: scale(0.97); }
    .btn-print {
      background: linear-gradient(180deg, var(--red), #86070e);
      color: white;
    }
    .btn-pdf {
      background: #111;
      border-color: rgba(225,9,26,0.7);
      color: var(--ink);
    }
    .btn-line {
      background: #06c755;
      color: #061509;
      box-shadow: 0 10px 22px rgba(6,199,85,0.16);
    }
    .btn-copy {
      background: #fffdf5;
      color: #111;
      border-color: rgba(244,196,81,0.72);
    }
    .btn-loading { opacity: 0.6; cursor: not-allowed; pointer-events: none; }

    /* ===================== フッター ===================== */
    .footer {
      text-align: center;
      padding: 32px 20px;
      border-top: 1px solid rgba(225,9,26,0.22);
      color: var(--sub);
      font-size: 13px;
      margin-top: 20px;
    }
    @media(max-width: 620px) {
      .hero { padding-top: 16px; }
      .hero-stats { gap: 8px; }
      .stat { padding: 12px 8px; }
      .stat-label { font-size: 10px; }
      .card-header-count { width: 100%; margin-left: 52px; text-align: left; }
      .podium { gap: 8px; }
      .r-bar-wrap { display: none; }
      .action-btn { min-width: 100%; }
      .footer { padding-bottom: 28px; }
    }

    /* ===================== 印刷スタイル ===================== */
    @media print {
      body { background: white; }
      .hero, .exam-buttons, .section-title, .action-bar, .footer { display: none !important; }
      .container { max-width: 100%; padding: 0; }
      .ranking-card { box-shadow: none; border: 1px solid #ddd; }
      .card-header { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .podium-block { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <!-- ===== ヒーロー ===== -->
  <div class="hero">
    <div class="hero-badge">TAKKEN RANKING</div>
    <h1>シーラ様専用<span>宅建模試成績ランキング</span></h1>
    <p>模擬試験1〜15回の成績をリアルタイムで確認・ダウンロード</p>
    <div class="hero-stats">
      <div class="stat">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">参加延べ人数</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-exams">—</div>
        <div class="stat-label">実施済み模試</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-avg">—</div>
        <div class="stat-label">全体平均点</div>
      </div>
    </div>
  </div>

  <!-- ===== メイン ===== -->
  <div class="container">

    <div class="section-title">模試を選択</div>

    <div class="exam-buttons" id="exam-buttons"></div>

    <div id="ranking-area"></div>

  </div>

  <div class="footer">
    宅建模試ランキングシステム &nbsp;|&nbsp; データはこのブラウザに保存されています
  </div>

  <script>
    // ============================================================
    // データ取得
    // ============================================================
    const STORAGE_KEY = 'takken_exam_scores';
    const PUBLIC_RESULTS_URL = 'https://kozarie.github.io/takken-ranking/results.html';
    const sharedRanking = loadSharedRanking();
    const EMBEDDED_MOBILE_DATA = {
      exam1: {
        date: '2026/5/11',
        scores: [
          { name: '田中彩花', score: 49 }, { name: '伊藤拓也', score: 49 }, { name: '鈴木美咲', score: 48 },
          { name: '高橋健太', score: 48 }, { name: '佐藤大輔', score: 47 }, { name: '小林直樹', score: 46 },
          { name: '加藤結衣', score: 46 }, { name: '山本翔太', score: 45 }, { name: '中村葵', score: 45 },
          { name: '渡辺陽菜', score: 44 }, { name: '松本隼人', score: 43 }, { name: '山田真央', score: 42 },
          { name: '佐々木蓮', score: 42 }, { name: '山口紗季', score: 42 }, { name: '吉田悠真', score: 41 },
          { name: '斎藤愛梨', score: 40 }, { name: '木村優斗', score: 39 }, { name: '林七海', score: 39 },
          { name: '清水大地', score: 39 }, { name: '井上莉子', score: 38 }, { name: '阿部航', score: 37 },
          { name: '池田悠人', score: 36 }, { name: '橋本美月', score: 36 }, { name: '山崎颯太', score: 35 },
          { name: '森花音', score: 35 }, { name: '後藤杏奈', score: 34 }, { name: '藤田琴音', score: 33 },
          { name: '岡田瑛太', score: 33 }, { name: '石川千尋', score: 32 }, { name: '前田陸', score: 32 },
          { name: '近藤匠', score: 30 }, { name: '石井菜々子', score: 30 }, { name: '坂本一真', score: 30 },
          { name: '長谷川蒼', score: 29 }, { name: '村上陽菜乃', score: 29 }, { name: '藤井美優', score: 27 },
          { name: '西村光', score: 27 }, { name: '福田凛', score: 27 }, { name: '遠藤彩乃', score: 26 },
          { name: '青木悠', score: 26 }, { name: '中島結菜', score: 24 }, { name: '小川拓海', score: 24 },
          { name: '太田啓介', score: 23 }, { name: '三浦咲良', score: 23 }, { name: '岡本晴人', score: 23 },
          { name: '竹内悠介', score: 21 }, { name: '和田優奈', score: 21 }, { name: '中川真由', score: 20 },
          { name: '原田大和', score: 20 }, { name: '松田紗良', score: 20 }
        ]
      }
    };

    function loadAll() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return Object.keys(saved).length ? saved : EMBEDDED_MOBILE_DATA;
      } catch {
        return EMBEDDED_MOBILE_DATA;
      }
    }

    function getExamScores(n) {
      if (sharedRanking && sharedRanking.exam === n) return sharedRanking.data;
      const all = loadAll();
      return all[`exam${n}`] || { scores: [], date: null };
    }

    // ============================================================
    // ヒーロー統計
    // ============================================================
    function buildHeroStats() {
      if (sharedRanking) {
        const scores = sharedRanking.data.scores || [];
        const scoreSum = scores.reduce((sum, row) => sum + row.score, 0);
        document.getElementById('stat-total').textContent = scores.length > 0 ? `${scores.length}人` : '—';
        document.getElementById('stat-exams').textContent = '1回';
        document.getElementById('stat-avg').textContent = scores.length > 0 ? `${(scoreSum/scores.length).toFixed(1)}点` : '—';
        return;
      }
      const all    = loadAll();
      const keys   = Object.keys(all);
      let total = 0, scoreSum = 0, scoreCount = 0;
      keys.forEach(k => {
        const s = all[k].scores || [];
        total += s.length;
        s.forEach(r => { scoreSum += r.score; scoreCount++; });
      });
      document.getElementById('stat-total').textContent = total > 0 ? `${total}人` : '—';
      document.getElementById('stat-exams').textContent = keys.length > 0 ? `${keys.length}回` : '—';
      document.getElementById('stat-avg').textContent   = scoreCount > 0 ? `${(scoreSum/scoreCount).toFixed(1)}点` : '—';
    }

    // ============================================================
    // 模試ボタン
    // ============================================================
    let currentExam = null;

    function buildButtons() {
      const all  = loadAll();
      const wrap = document.getElementById('exam-buttons');
      wrap.innerHTML = Array.from({length:15}, (_,i) => {
        const n   = i + 1;
        const d   = sharedRanking && sharedRanking.exam === n ? sharedRanking.data : all[`exam${n}`];
        const cnt = d ? (d.scores||[]).length : 0;
        const hasData = cnt > 0;
        return `
          <button class="exam-btn ${hasData?'has-data':''}" id="ebtn-${n}" onclick="selectExam(${n})">
            ${hasData ? '<span class="btn-dot"></span>' : ''}
            <span class="btn-num">模試${n}</span>
            <span class="btn-sub">${hasData ? cnt+'人参加' : '未実施'}</span>
          </button>`;
      }).join('');
    }

    function selectExam(n, shouldScroll = true) {
      currentExam = n;
      document.querySelectorAll('.exam-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById(`ebtn-${n}`);
      if (btn) btn.classList.add('active');
      renderRanking(n);
      if (shouldScroll) {
        document.getElementById('ranking-area').scrollIntoView({ behavior:'smooth', block:'start' });
      }
    }

    // ============================================================
    // ランキング描画
    // ============================================================
    const MEDALS  = ['1','2','3'];

    function renderRanking(n) {
      const exam   = getExamScores(n);
      const scores = [...(exam.scores||[])].sort((a,b) => b.score - a.score);
      const area   = document.getElementById('ranking-area');

      if (!scores.length) {
        area.innerHTML = `
          <div class="ranking-card">
            <div class="empty-state">
              <div class="icon">NO DATA</div>
              <h3>模擬試験 ${n} のデータがありません</h3>
              <p>host.html でこの模試を実施してください</p>
            </div>
          </div>`;
        return;
      }

      const avg = (scores.reduce((s,r)=>s+r.score,0)/scores.length).toFixed(1);
      const max = scores[0].score;
      const min = scores[scores.length-1].score;

      // 表彰台（3位まで）
      const podiumHtml = scores.length >= 1 ? buildPodium(scores) : '';

      // 全リスト
      const listHtml = scores.map((s,i) => {
        const pct  = Math.round((s.score/50)*100);
        const cls  = i < 3 ? `rank${i+1}` : '';
        const med  = MEDALS[i] || '';
        return `
          <div class="rank-row ${cls}">
            <div class="r-rank">${med || i+1}</div>
            <div class="r-name">${esc(s.name)}</div>
            <div class="r-bar-wrap"><div class="r-bar" style="width:${pct}%"></div></div>
            <div class="r-score">${s.score}<span class="u">点</span></div>
          </div>`;
      }).join('');

      area.innerHTML = `
        <div class="ranking-card" id="ranking-card">
          <div class="card-header">
            <div class="card-header-icon">RANK</div>
            <div class="card-header-text">
              <h2>模擬試験 ${n} ランキング</h2>
              <p>${exam.date || '実施日未記録'}</p>
            </div>
            <div class="card-header-count">
              <div class="count-num">${scores.length}</div>
              <div class="count-label">名参加</div>
            </div>
          </div>

          ${podiumHtml}

          <div class="stats-row">
            <div class="stat-box"><div class="val">${max}点</div><div class="lbl">最高点</div></div>
            <div class="stat-box"><div class="val">${avg}点</div><div class="lbl">平均点</div></div>
            <div class="stat-box"><div class="val">${min}点</div><div class="lbl">最低点</div></div>
          </div>

          <div class="rank-table">${listHtml}</div>

          <div class="action-bar">
            <button class="action-btn btn-line" onclick="shareToLine(${n})">
              LINEで共有
            </button>
            <button class="action-btn btn-copy" onclick="copyShareLink(${n})">
              共有リンクをコピー
            </button>
            <button class="action-btn btn-print" onclick="printRanking()">
              印刷する
            </button>
            <button class="action-btn btn-pdf" id="pdf-btn" onclick="downloadPDF(${n})">
              PDFダウンロード
            </button>
          </div>
        </div>`;
    }

    function buildPodium(scores) {
      const top = scores.slice(0,3);
      // 表彰台は [2位, 1位, 3位] の順に並べる
      const order = [top[1], top[0], top[2]].filter(Boolean);
      const clsMap = ['second','first','third'];
      const realOrder = top.length === 1 ? [top[0]] : order;
      const items = realOrder.map((s,i) => {
        const origIdx = top.indexOf(s);
        const cls     = clsMap[origIdx] ?? 'first';
        const medal   = MEDALS[origIdx] ?? '';
        const blockLabel = origIdx + 1;
        return `
          <div class="podium-item ${cls}">
            <div class="podium-medal">${medal}</div>
            <div class="podium-name">${esc(s.name)}</div>
            <div class="podium-score">${s.score}<span class="u">点</span></div>
            <div class="podium-block">${blockLabel}</div>
          </div>`;
      }).join('');
      return `<div class="podium">${items}</div>`;
    }

    // ============================================================
    // 印刷
    // ============================================================
    function printRanking() {
      window.print();
    }

    // ============================================================
    // LINE共有
    // ============================================================
    function buildShareUrl(n) {
      const exam = getExamScores(n);
      const payload = {
        exam: n,
        data: {
          scores: exam.scores || [],
          date: exam.date || null
        }
      };
      const encoded = base64UrlEncode(JSON.stringify(payload));
      return `${PUBLIC_RESULTS_URL}?exam=${n}&share=${encoded}`;
    }

    function shareToLine(n) {
      const url = buildShareUrl(n);
      const text = `宅建模試${n}の成績ランキングはこちら`;
      window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank', 'noopener');
    }

    async function copyShareLink(n) {
      const url = buildShareUrl(n);
      try {
        await navigator.clipboard.writeText(url);
        alert('共有リンクをコピーしました。LINEに貼り付けて送れます。');
      } catch {
        prompt('このURLをコピーしてLINEに貼り付けてください', url);
      }
    }

    function loadSharedRanking() {
      const sharedValue = new URLSearchParams(location.search).get('share');
      if (!sharedValue) return null;
      try {
        const payload = JSON.parse(base64UrlDecode(sharedValue));
        const exam = Number(payload.exam);
        const data = payload.data || {};
        if (!Number.isInteger(exam) || exam < 1 || exam > 15 || !Array.isArray(data.scores)) return null;
        return {
          exam,
          data: {
            scores: data.scores
              .filter(row => row && typeof row.name !== 'undefined' && typeof row.score !== 'undefined')
              .map(row => ({ name: String(row.name), score: Number(row.score) }))
              .filter(row => row.name && Number.isFinite(row.score)),
            date: data.date || null
          }
        };
      } catch {
        return null;
      }
    }

    function base64UrlEncode(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = '';
      bytes.forEach(byte => { binary += String.fromCharCode(byte); });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function base64UrlDecode(text) {
      const base64 = text.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(text.length / 4) * 4, '=');
      const binary = atob(base64);
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    // ============================================================
    // PDFダウンロード
    // ============================================================
    async function downloadPDF(n) {
      const btn = document.getElementById('pdf-btn');
      btn.classList.add('btn-loading');
      btn.textContent = '生成中...';

      try {
        const card = document.getElementById('ranking-card');

        // action-barを一時非表示
        const actionBar = card.querySelector('.action-bar');
        actionBar.style.display = 'none';

        const canvas = await html2canvas(card, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false
        });

        actionBar.style.display = '';

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        const pageW = 210;
        const pageH = 297;
        const margin = 10;
        const imgW = pageW - margin * 2;
        const imgH = (canvas.height / canvas.width) * imgW;

        let yPos = margin;
        let remainH = imgH;
        const pageImgH = pageH - margin * 2;

        const imgData = canvas.toDataURL('image/jpeg', 0.92);

        while (remainH > 0) {
          const sliceH = Math.min(remainH, pageImgH);
          pdf.addImage(imgData, 'JPEG', margin, yPos, imgW, imgH);
          remainH -= pageImgH;
          if (remainH > 0) {
            pdf.addPage();
            yPos = margin - (imgH - sliceH);
          }
        }

        pdf.save(`宅建模試${n}_ランキング.pdf`);
      } catch(e) {
        alert('PDF生成に失敗しました。印刷機能をお使いください。');
        console.error(e);
      } finally {
        btn.classList.remove('btn-loading');
        btn.innerHTML = 'PDFダウンロード';
      }
    }

    // ============================================================
    // ユーティリティ
    // ============================================================
    function esc(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
    }

    // ============================================================
    // 初期化
    // ============================================================
    buildHeroStats();
    buildButtons();

    // URLパラメータで模試を指定できる (?exam=3 など)
    const params = new URLSearchParams(window.location.search);
    const initExam = parseInt(params.get('exam'));
    if (sharedRanking) {
      selectExam(sharedRanking.exam, false);
    } else if (initExam >= 1 && initExam <= 15) {
      selectExam(initExam, false);
    } else {
      const all = loadAll();
      const firstExamWithData = Array.from({length:15}, (_, i) => i + 1)
        .find(n => (all[`exam${n}`]?.scores || []).length > 0);
      selectExam(firstExamWithData || 1, false);
    }
  </script>
</body>
