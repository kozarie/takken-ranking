<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宅建模試 点数入力</title>
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: white; border-radius: 24px;
      padding: 36px 28px; width: 100%; max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    }
    h1 { font-size: 24px; color: #1a1a2e; text-align: center; margin-bottom: 6px; }
    .subtitle { color: #999; font-size: 14px; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 700; color: #444; margin-bottom: 7px; }
    input {
      width: 100%; padding: 15px 18px; font-size: 17px;
      border: 2px solid #eee; border-radius: 12px;
      outline: none; transition: border-color 0.2s; -webkit-appearance: none;
    }
    input:focus { border-color: #667eea; }
    .error { color: #e74c3c; font-size: 13px; min-height: 18px; margin-top: 5px; }
    .submit-btn {
      width: 100%; padding: 18px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; border-radius: 12px;
      font-size: 18px; font-weight: 700; cursor: pointer;
      margin-top: 6px; transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* 完了 */
    .result { display:none; text-align:center; animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pop { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:scale(1)} }
    .result .icon { font-size: 72px; margin-bottom: 14px; }
    .result h2 { font-size: 22px; color: #1a1a2e; margin-bottom: 10px; }
    .score-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; font-size: 32px; font-weight: 800;
      padding: 10px 28px; border-radius: 50px; margin: 12px 0 16px;
    }
    .result p { color: #888; font-size: 15px; line-height: 1.7; }

    /* エラー */
    #error-screen { display:none; text-align:center; }
    #error-screen .icon { font-size: 52px; margin-bottom: 12px; }
    #error-screen h2 { font-size: 18px; color: #e74c3c; margin-bottom: 8px; }
    #error-screen p { color: #999; font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
    .reload-btn {
      padding: 12px 28px; background: #667eea; color: white;
      border: none; border-radius: 10px; font-size: 15px;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }

    /* URLなし画面 */
    #no-room { display:none; text-align:center; }
    #no-room .icon { font-size: 52px; margin-bottom: 14px; }
    #no-room h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 8px; }
    #no-room p { color: #999; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="card">

  <!-- 入力フォーム -->
  <div id="form-section">
    <h1>🏠 宅建模試</h1>
    <p class="subtitle" id="exam-label">点数を入力してランキングに参加！</p>

    <div class="field">
      <label for="name">お名前（ニックネームでもOK）</label>
      <input type="text" id="name" placeholder="例：田中太郎" maxlength="20" autocomplete="off">
      <div class="error" id="name-err"></div>
    </div>

    <div class="field">
      <label for="score">今日の点数（0〜50点）</label>
      <input type="number" id="score" placeholder="例：35" min="0" max="50" inputmode="numeric">
      <div class="error" id="score-err"></div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitScore()">
      送信してランキングを見る 🚀
    </button>
  </div>

  <!-- 送信完了 -->
  <div class="result" id="success-section">
    <div class="icon">🎉</div>
    <h2 id="success-name">お疲れ様でした！</h2>
    <div class="score-badge" id="success-score">-- 点</div>
    <p>ランキングに登録されました。<br>先生の画面を確認してください！</p>
  </div>

  <!-- 接続エラー -->
  <div id="error-screen">
    <div class="icon">😢</div>
    <h2>送信できませんでした</h2>
    <p>ネットワークを確認して<br>もう一度お試しください。</p>
    <button class="reload-btn" onclick="location.reload()">再試行する</button>
  </div>

  <!-- URLなし（QRコードなしで直接開いた場合） -->
  <div id="no-room">
    <div class="icon">📱</div>
    <h2>先生のQRコードをスキャンしてください</h2>
    <p>このページは先生のランキング画面に表示されている<br>QRコード、またはLINEで受け取ったURLから開いてください。</p>
  </div>

</div>

<script>
  const params   = new URLSearchParams(window.location.search);
  const roomCode = params.get('room');
  const examN    = params.get('exam') || '1';

  if (!roomCode) {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('no-room').style.display = 'block';
  } else {
    document.getElementById('exam-label').textContent = `模擬試験 ${examN} の点数を入力してください`;
  }

  window.submitScore = function () {
    const name     = document.getElementById('name').value.trim();
    const scoreRaw = document.getElementById('score').value;
    const score    = parseInt(scoreRaw, 10);
    const nameErr  = document.getElementById('name-err');
    const scoreErr = document.getElementById('score-err');
    const btn      = document.getElementById('submit-btn');

    nameErr.textContent = ''; scoreErr.textContent = '';
    let hasErr = false;
    if (!name)                                               { nameErr.textContent  = '名前を入力してください'; hasErr = true; }
    if (scoreRaw === '' || isNaN(score) || score < 0 || score > 50) { scoreErr.textContent = '0〜50の整数を入力してください'; hasErr = true; }
    if (hasErr) return;

    btn.disabled    = true;
    btn.textContent = '送信中...';

    const BROKER = 'wss://broker.hivemq.com:8884/mqtt';
    const client = mqtt.connect(BROKER, {
      clientId: 'join_' + Math.random().toString(36).substr(2,8),
      clean: true,
      connectTimeout: 12000,
    });

    const timeout = setTimeout(() => {
      client.end(true);
      showError();
    }, 15000);

    client.on('connect', () => {
      const payload = JSON.stringify({ name, score, exam: parseInt(examN, 10) });
      client.publish(`takken/${roomCode}`, payload, { qos: 1 }, (err) => {
        clearTimeout(timeout);
        client.end(true);
        if (err) showError();
        else     showSuccess(name, score);
      });
    });

    client.on('error', () => {
      clearTimeout(timeout);
      client.end(true);
      showError();
    });
  };

  function showSuccess(name, score) {
    document.getElementById('form-section').style.display    = 'none';
    document.getElementById('success-section').style.display = 'block';
    document.getElementById('success-name').textContent  = `${name}さん、お疲れ様！`;
    document.getElementById('success-score').textContent = `${score} 点`;
  }

  function showError() {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('error-screen').style.display = 'block';
  }
</script>
</body>
</html>
